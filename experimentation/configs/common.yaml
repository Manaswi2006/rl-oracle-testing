# Common configuration (CoRe upstream defaults from upstream/CoRe/config/train_CoRe.yaml + run_meta.sh,
# except where marked DEVIATION).
method: core            # core | rrm_only | env_dense | env_sparse | ext
ext_name: none
env: metaworld_button-press-topdown-v2
seed: 0
device: cuda
run_id: pilot
run_dir: runs/pilot
segment: 20             # run_meta.sh
activation: tanh
num_seed_steps: 1000
num_pre_steps: 19000    # run_meta.sh
num_interact: 4000
RRM_lr: 0.0003
RRM_batch: 20           # run_meta.sh (RRM_batch=20)
RRM_update: 10
reset_update: 100
ensemble_size: 3
max_feedback: 500
large_batch: 10
reward_alpha: 0.5
conv_kernel_sizes: [5, 3, 3, 3]
conv_n_channels: [16, 32, 64, 128]
conv_strides: [3, 2, 2, 2]
image_size: 128         # DEVIATION: upstream 300 (memory: 12+ parallel runs)
teacher_eps_mistake: 0.15   # DEVIATION: simulated VLM teacher label noise (no VLM API authorised)
num_train_steps: 200000     # DEVIATION: upstream 500000 (compute budget)
replay_buffer_capacity: 200000
eval_frequency: 10000
num_eval_episodes: 10
num_final_eval_episodes: 50
diag_episodes: 20          # final-policy rollouts used to measure learned-reward shortcut rate (C1)
